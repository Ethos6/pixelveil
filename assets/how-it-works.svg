<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
  <title id="title">How PixelVeil works</title>
  <desc id="desc">PixelVeil checks supported image containers, writes a cleaned copy, keeps encoded image data unchanged, and verifies the result.</desc>
  <rect width="1120" height="330" rx="24" fill="#101827"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g fill="#17283a" stroke="#35506c" stroke-width="2">
      <rect x="38" y="92" width="220" height="142" rx="18"/>
      <rect x="316" y="92" width="220" height="142" rx="18"/>
      <rect x="594" y="92" width="220" height="142" rx="18"/>
      <rect x="872" y="92" width="210" height="142" rx="18"/>
    </g>
    <g fill="#f0f7ff" font-size="20" font-weight="700">
      <text x="148" y="139">1 · Inspect</text>
      <text x="426" y="139">2 · Clean</text>
      <text x="704" y="139">3 · Preserve</text>
      <text x="977" y="139">4 · Verify</text>
    </g>
    <g fill="#a8bfd4" font-size="15">
      <text x="148" y="174">Classify known markers</text><text x="148" y="197">without printing values</text>
      <text x="426" y="174">Write a new copy</text><text x="426" y="197">never overwrite source</text>
      <text x="704" y="174">Copy compressed pixels</text><text x="704" y="197">and color profile verbatim</text>
      <text x="977" y="174">Re-scan output</text><text x="977" y="197">compare payload hashes</text>
    </g>
    <g stroke="#72e3d0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M264 163h42m-11-11 11 11-11 11"/><path d="M542 163h42m-11-11 11 11-11 11"/><path d="M820 163h42m-11-11 11 11-11 11"/>
    </g>
    <text x="560" y="285" fill="#83a0ba" font-size="14">All file processing stays local. No pixel re-encoding, uploads, or analytics.</text>
  </g>
</svg>
